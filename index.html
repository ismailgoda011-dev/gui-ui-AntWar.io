<!DOCTYPE html>
<html lang="en" dir="rtl" id="game-html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="game-title" data-i18n="game.title">AntWar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&family=Fredoka:wght@600;700;800&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="tailwind.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <link rel="stylesheet" href="style.css" id="main-stylesheet">
    <link rel="stylesheet" href="js/core/performance.css">
    <link rel="stylesheet" href="js/ui/experience-overrides.css">
</head>
<body id="game-body" class="w-full h-screen h-[100dvh] overflow-hidden game-bg flex justify-center items-center select-none font-game">
    <div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center loading-screen transition-opacity duration-500">
        <div class="absolute inset-0 loading-overlay opacity-95"></div>
        <div class="relative z-10 flex flex-col items-center gap-4 max-w-[380px] w-[90vw] text-center px-4">
            <div class="w-20 h-20 relative flex items-center justify-center animate-bounce"><img src="img/ant1.png" alt="Ant" class="w-16 h-16 object-contain"></div>
            <h1 class="font-display text-3xl sm:text-4xl tracking-wider loading-title" data-i18n="loading.title">حرب النمل</h1>
            <p id="loading-status-text" class="text-xs sm:text-sm font-bold loading-status" data-i18n="loading.subtitle">جاري تجهيز ساحة المعركة وتحميل الموارد...</p>
            <div class="w-full rounded-full h-3.5 p-0.5 overflow-hidden shadow-inner relative loading-track"><div id="loading-progress-bar" class="h-full rounded-full transition-all duration-150 w-0"></div></div>
            <div class="flex justify-between w-full text-[11px] font-black px-1 loading-counter"><span id="loading-percent-text">0%</span><span id="loading-assets-counter">0 / 0</span></div>
            <div class="mt-4 p-2.5 rounded-lg text-[11px] italic flex items-center gap-1.5 shadow loading-tip-box"><span>💡</span><span id="loading-tip-text" data-i18n="loading.tip">النملة الصغيرة تستطيع حمل ما يفوق وزنها بمئة مرة!</span></div>
        </div>
    </div>
    <canvas id="ambient-particles-canvas" class="absolute inset-0 pointer-events-none layer-base"></canvas>
    <div id="ambient-overlay" class="absolute inset-0 pointer-events-none layer-base ambient-overlay"></div>
    <div id="main-app-container" class="layer-ui w-full h-full flex flex-col justify-between items-center p-2 sm:p-4 max-w-[1600px] relative">
        <header id="app-header" class="w-full flex justify-between items-center gap-2">
            <div id="left-hud-row" class="flex items-center gap-2.5 flex-wrap">
                <div id="profile-section-wrapper" class="profile-section flex items-center relative group cursor-pointer transition-transform hover:scale-105 active:scale-95 duration-200" title="عرض وتعديل الملف الشخصي" data-i18n-title="nav.profileTitle">
                    <div id="avatar-container" class="avatar-container w-[clamp(50px,6.2vw,74px)] h-[clamp(50px,6.2vw,74px)] relative z-10 flex justify-center items-center drop-shadow-[0_8px_14px_rgba(0,0,0,0.8)] flex-shrink-0"><img id="avatar-image" src="img/ant1.png" alt="Commander Avatar" class="w-[72%] h-[72%] rounded-full object-cover absolute"><img id="avatar-frame-image" src="img/frame.png" alt="Frame" class="w-full h-full absolute top-0 left-0 pointer-events-none"><span id="player-hud-pass-badge" class="absolute -bottom-1 -left-1 font-black text-[9px] px-1.5 py-0.5 rounded-md shadow drop-shadow hud-pass-badge">👑 Lvl 18</span></div>
                    <div id="name-bar-container" class="name-bar relative z-0 flex flex-col items-center justify-center drop-shadow-md"><span id="player-name-text" class="player-name text-[clamp(11px,1.15vw,15px)] font-black leading-tight whitespace-nowrap overflow-hidden text-ellipsis max-w-[95%] drop-shadow-[0_2px_3px_rgba(0,0,0,0.9)] hud-player-name">Ant Commander</span></div>
                </div>
                <div id="currency-hud" class="flex items-center gap-2">
                    <div id="gold-hud-pill" class="hud-pill text-bg-box min-w-fit px-2.5 py-1 flex items-center gap-1.5 cursor-pointer group" title="شحن الذهب"><img id="gold-icon-img" src="img/Coin.png" alt="Gold Coins" class="icon-currency"><span id="player-gold-count" class="text-xs font-black drop-shadow hud-pill-text">12,450</span><button id="gold-add-btn" class="hud-plus-btn ml-1 w-4 h-4 rounded-full text-[11px] font-black flex items-center justify-center leading-none group-hover:scale-110 transition-transform">+</button></div>
                    <div id="gems-hud-pill" class="hud-pill text-bg-box min-w-fit px-2.5 py-1 flex items-center gap-1.5 cursor-pointer group" title="شحن الألماس"><img id="diamond-icon-img" src="img/Diamond.png" alt="Diamonds" class="icon-currency"><span id="player-gems-count" class="text-xs font-black drop-shadow hud-pill-text">350</span><button id="gems-add-btn" class="hud-plus-btn ml-1 w-4 h-4 rounded-full text-[11px] font-black flex items-center justify-center leading-none group-hover:scale-110 transition-transform">+</button></div>
                </div>
                <button id="open-settings-btn" class="rpg-unified-btn group" aria-label="Settings" type="button"><div class="rpg-btn-icon-wrap"><img id="settings-nav-icon" src="img/Settings.png" alt="Settings" class="w-[clamp(32px,3.8vw,44px)] h-[clamp(32px,3.8vw,44px)] drop-shadow"></div></button>
                <button id="global-hud-back-btn" class="hud-home-back-btn hidden items-center gap-1.5 px-3 py-1.5 rounded-full border-2 shadow-xl font-black text-xs cursor-pointer z-[160]" title="العودة للرئيسية"><i class="fa-solid fa-house text-sm"></i><span class="hidden sm:inline">الرئيسية</span></button>
            </div>
            <div id="events-quick-dock" class="flex items-center gap-2" data-ui-registry="header-dock"></div>
        </header>
        <main id="main-content-area" class="main-menu flex items-center justify-center w-full my-auto relative">
            <div id="main-box-wrapper" class="relative w-[clamp(270px,36vw,400px)] max-h-[60vh] flex flex-col items-center perspective-container animate-floating">
                <div id="main-box-container" class="main-box-shell relative w-full flex justify-center items-center transition-transform duration-100 ease-out"><img id="main-box-image" src="img/box.png" alt="Main Box" class="box-art"><div id="box-buttons-container" class="main-box-cavity">
                    <button id="play-action-btn" class="btn-press play-btn flex justify-center drop-shadow-[0_6px_10px_rgba(0,0,0,0.5)]" title="بدء المعركة" type="button"><img id="play-btn-image" src="img/Play.png" alt="Play Game" class="w-[clamp(110px,15.5vw,155px)] h-auto block"></button>
                    <div id="server-selector-container" class="relative flex flex-col items-center w-full"><button id="server-selector-btn" type="button" class="w-[clamp(120px,16vw,165px)] px-2.5 py-1 rounded-lg flex items-center justify-between shadow-md cursor-pointer server-selector-btn"><div class="flex items-center gap-1.5 truncate"><span id="active-server-status-dot" class="w-2 h-2 rounded-full animate-pulse flex-shrink-0 server-dot-online"></span><span id="active-server-name" class="text-[10px] font-black truncate server-name-text">الشرق الأوسط</span></div><span id="active-server-ping" class="text-[9px] font-black px-1 rounded border flex-shrink-0 server-ping-tag">18ms</span></button><div id="server-dropdown-menu" class="hidden absolute bottom-full mb-1.5 w-[clamp(135px,18vw,180px)] border-2 rounded-xl p-1 shadow-2xl z-40 flex flex-col gap-1 backdrop-blur-md server-dropdown-menu"><div class="text-[9px] font-black px-1 py-0.5 border-b flex justify-between items-center server-dropdown-header"><span>اختر المنطقة</span><span>🌐 البينج</span></div><div id="server-options-list" class="flex flex-col gap-1"></div></div></div>
                    <div id="server-stats-container" class="flex items-center justify-center gap-2 w-full mt-1 select-none"><div id="server-players-stat" class="flex items-center gap-1.5 px-2 py-0.5 rounded-md shadow-sm server-stat-badge"><span class="w-2 h-2 rounded-full animate-ping server-dot-online"></span><span class="text-[10px] font-black server-stat-val-white"><span id="server-players-count">4,820</span> <span class="font-normal server-stat-lbl">متصل</span></span></div><div id="server-rooms-stat" class="flex items-center gap-1.5 px-2 py-0.5 rounded-md shadow-sm server-stat-badge"><span class="text-[10px]">🏰</span><span class="text-[10px] font-black server-stat-val-gold"><span id="server-rooms-count">340</span> <span class="font-normal server-stat-lbl">غرفة</span></span></div></div>
                </div></div>
                <button id="create-room-action-btn" class="btn-press layer-base -mt-[7%] w-[clamp(135px,19vw,195px)] drop-shadow-[0_8px_16px_rgba(0,0,0,0.7)]" title="إنشاء غرفة معركة مخصصة"><img id="create-room-image" src="img/Create Room.png" alt="Create Room" class="w-full h-auto block"></button>
                <nav id="header-nav-menu" class="circular-menu flex gap-[clamp(8px,1.5vw,16px)] items-center justify-center mt-3 z-20 flex-wrap"><button id="wardrobe-nav-btn" class="rpg-unified-btn group" aria-label="Wardrobe"><div class="rpg-btn-icon-wrap"><img id="wardrobe-nav-icon" src="img/Wardrobe.png" alt="Wardrobe" class="w-[clamp(34px,4vw,46px)] h-[clamp(34px,4vw,46px)] drop-shadow"></div><span class="rpg-btn-label">الدولاب</span></button><button id="rank-nav-btn" class="rpg-unified-btn group" aria-label="Rankings"><div class="rpg-btn-icon-wrap"><img id="rank-nav-icon" src="img/Rank.png" alt="Rank" class="w-[clamp(34px,4vw,46px)] h-[clamp(34px,4vw,46px)] drop-shadow"></div><span class="rpg-btn-label">المتصدرون</span></button></nav>
            </div>
        </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-container"></div>
    <div id="mobile-bottom-nav"></div>
    <script type="module">import { initRuntime } from './js/core/runtime.js'; initRuntime();</script>
    <script type="module" src="script.js" id="main-script"></script>
    <script type="module" src="js/ui/experience-overrides-v3.js"></script>
    <script type="module" src="js/ui/experience-bridge.js"></script>
</body>
</html>
