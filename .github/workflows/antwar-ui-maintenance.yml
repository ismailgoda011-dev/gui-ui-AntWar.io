name: AntWar UI Maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-ui-maintenance:
    if: "!contains(github.event.head_commit.message, '[ui-maintenance]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply UI fixes and upgrades
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')
          style = root / 'style.css'
          script = root / 'script.js'
          index = root / 'index.html'
          package = root / 'package.json'

          # 1) Fix the Royal Pass crash: the loop variable `t` was shadowing the translation function `t()`.
          s = script.read_text(encoding='utf-8')
          start = s.find('function renderTrack()')
          end = s.find('function renderDailyMissions()', start)
          if start != -1 and end != -1:
              block = s[start:end]
              block = block.replace('royalPassTiers.slice(0, 30).forEach(t => {', 'royalPassTiers.slice(0, 30).forEach(tier => {')
              for prop in ('tier', 'freeReward', 'premiumReward', 'unlocked', 'claimed'):
                  block = re.sub(r'(?<![A-Za-z0-9_$])t\\.' + prop + r'\\b', 'tier.' + prop, block)
              s = s[:start] + block + s[end:]

          # 2) Improve chat behavior: real local send/reply rendering for the desktop Discord-like chat.
          chat_marker = '// ANTWR_CHAT_V1_PATCH'
          if chat_marker not in s:
              patch = r'''

    // ANTWR_CHAT_V1_PATCH
    // Lightweight local chat controller: Enter/Send, timestamp, scroll-to-bottom and unread reset.
    (() => {
        const input = document.getElementById('desktop-popup-chat-input');
        const send = document.getElementById('desktop-popup-chat-send');
        const list = document.getElementById('desktop-popup-chat-messages');
        if (!input || !send || !list) return;

        const sendMessage = () => {
            const text = (input.value || '').trim();
            if (!text) return;
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const avatar = (typeof savedProfile !== 'undefined' && savedProfile.avatar) ? savedProfile.avatar : 'img/ant1.png';
            const name = (typeof savedProfile !== 'undefined' && savedProfile.name) ? savedProfile.name : 'أنت';
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-start self-end flex-row-reverse max-w-[88%] antwar-chat-message is-mine';
            row.innerHTML = `
                <img src="${avatar}" class="w-8 h-8 rounded-full border object-cover flex-shrink-0 shadow chat-avatar-mine" alt="">
                <div class="flex flex-col gap-0.5 text-left min-w-0">
                    <div class="flex items-center justify-end gap-1.5">
                        <span class="text-[8.5px] chat-time-text">${time}</span>
                        <span class="text-[11px] font-black chat-name-mine">${name}</span>
                    </div>
                    <div class="chat-bubble-mine text-xs font-bold shadow-md break-words">${text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>
                </div>`;
            list.appendChild(row);
            input.value = '';
            list.scrollTop = list.scrollHeight;
            if (typeof playSound === 'function') playSound('chat');
        };

        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        list.scrollTop = list.scrollHeight;
    })();
'''
              idx = s.rfind('\n});')
              if idx != -1:
                  s = s[:idx] + patch + s[idx:]

          script.write_text(s, encoding='utf-8')

          # 3) Upgrade settings/dropdowns/profile/chat visually without replacing existing assets or behavior.
          css_patch = r'''

/* ==========================================================
   AntWar v1.0 UI polish — direct main release
   ========================================================== */
:root {
    --ui-surface: rgba(17, 24, 39, 0.96);
    --ui-surface-2: rgba(25, 33, 48, 0.98);
    --ui-surface-3: rgba(31, 41, 55, 0.94);
    --ui-accent: #5865f2;
    --ui-accent-2: #7289da;
    --ui-text: #f5f7fa;
    --ui-muted: #b5bac1;
    --ui-success: #23a55a;
    --ui-border: rgba(114, 137, 218, 0.42);
}

/* Never use topbar-box.png as a window top-bar background. */
.wood-modal-header,
.full-page-header,
.desktop-popup-chat .chat-popup-header {
    background-image: none !important;
}

.wood-modal-header {
    background: linear-gradient(180deg, rgba(40, 48, 65, 0.98), rgba(24, 30, 43, 0.98)) !important;
    border-bottom: 1px solid rgba(114, 137, 218, 0.35);
    border-radius: 12px 12px 8px 8px;
    min-height: 44px;
}

/* Settings: centered tabs, slightly larger white text and cleaner panels. */
.settings-tab-bar {
    justify-content: center !important;
    align-items: center;
    gap: 10px;
    padding: 7px 8px 9px;
    margin-inline: auto;
    width: min(100%, 520px);
}

.settings-tab-bar .wood-tab-btn {
    color: #ffffff !important;
    font-size: 13px !important;
    font-weight: 900 !important;
    min-height: 40px;
    padding: 7px 15px;
    background: rgba(31, 41, 55, 0.92);
    border-color: rgba(148, 163, 184, 0.28);
    text-shadow: 0 1px 3px rgba(0,0,0,.75);
}

.settings-tab-bar .wood-tab-btn:hover,
.settings-tab-bar .wood-tab-btn.active {
    color: #ffffff !important;
    background: linear-gradient(180deg, #5865f2, #4752c4) !important;
    border-color: rgba(255,255,255,.55) !important;
    box-shadow: 0 5px 18px rgba(88,101,242,.28);
}

#settings-panel-toggles,
#settings-panel-dropdowns,
#settings-panel-audio {
    width: min(100%, 520px) !important;
    margin-inline: auto !important;
}

#settings-panel-toggles {
    align-items: center !important;
}

#settings-panel-toggles > .rpg-toggle-pill {
    width: min(100%, 470px);
    margin-inline: auto;
}

.rpg-toggle-pill {
    min-height: 48px;
    padding: 9px 13px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(31,41,55,.96), rgba(17,24,39,.98));
    border: 1px solid rgba(148,163,184,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 5px 14px rgba(0,0,0,.22);
}

.rpg-toggle-pill:hover {
    border-color: rgba(114,137,218,.72);
    transform: translateY(-1px);
}

.rpg-toggle-pill .text-white {
    font-size: 12.5px !important;
}

/* Dropdowns: one open at a time, deterministic hidden state and one arrow only. */
.rpg-dropdown-wrapper {
    position: relative !important;
    z-index: 1;
}
.rpg-dropdown-wrapper.open {
    z-index: 300 !important;
}
.rpg-dropdown-trigger {
    position: relative;
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(31,41,55,.98), rgba(17,24,39,.98));
    border: 1px solid rgba(148,163,184,.28);
    color: #fff;
}
.rpg-dropdown-trigger:hover,
.rpg-dropdown-wrapper.open .rpg-dropdown-trigger {
    border-color: rgba(114,137,218,.8);
    box-shadow: 0 0 0 2px rgba(88,101,242,.12);
}
.rpg-dropdown-trigger::before,
.rpg-dropdown-trigger::after {
    content: none !important;
    display: none !important;
}
.rpg-dropdown-arrow {
    width: 18px !important;
    height: 18px !important;
    object-fit: contain;
    flex: 0 0 18px;
    margin-inline-start: auto;
    transition: transform .18s ease;
}
.rpg-dropdown-wrapper.open .rpg-dropdown-arrow {
    transform: rotate(180deg);
}
.rpg-dropdown-menu {
    position: absolute !important;
    inset-inline: 0 !important;
    top: calc(100% + 6px) !important;
    bottom: auto !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 4px;
    padding: 6px !important;
    max-height: 240px;
    overflow-y: auto;
    background: rgba(17,24,39,.99) !important;
    border: 1px solid rgba(114,137,218,.6) !important;
    border-radius: 12px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
    backdrop-filter: blur(12px);
    z-index: 999 !important;
}
.rpg-dropdown-menu.hidden { display: none !important; }
.rpg-dropdown-option {
    min-height: 38px;
    display: flex;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    color: #f5f7fa;
    background: transparent;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
}
.rpg-dropdown-option:hover {
    background: rgba(88,101,242,.22);
    color: #fff;
}

/* Discord-inspired chat system: neutral slate surfaces + indigo accents instead of brown/gold. */
.desktop-popup-chat {
    background: var(--ui-surface) !important;
    border: 1px solid rgba(0,0,0,.65) !important;
    border-left: 1px solid rgba(0,0,0,.65) !important;
    border-radius: 16px !important;
    box-shadow: 0 24px 70px rgba(0,0,0,.62) !important;
}
.desktop-popup-chat .chat-popup-header {
    background: #111827 !important;
    border-bottom: 1px solid rgba(255,255,255,.07) !important;
    padding: 14px 16px !important;
}
.desktop-popup-chat .chat-popup-title { color: #f2f3f5 !important; font-size: 13px !important; }
.desktop-popup-chat .chat-online-count { color: #23a55a !important; }
.desktop-popup-chat .chat-body-area { background: #313338 !important; }
.desktop-popup-chat .chat-tabs-sidebar {
    background: #2b2d31 !important;
    border-right: 0 !important;
    border-left: 1px solid rgba(0,0,0,.2) !important;
    padding: 10px 7px !important;
}
.desktop-popup-chat .chat-tab-btn {
    color: #b5bac1 !important;
    border: 0 !important;
    background: transparent !important;
    border-radius: 10px !important;
    min-height: 54px;
}
.desktop-popup-chat .chat-tab-btn:hover { color: #f2f3f5 !important; background: #3f4147 !important; }
.desktop-popup-chat .chat-tab-btn.active { color: #fff !important; background: #5865f2 !important; border: 0 !important; box-shadow: none !important; }
.desktop-popup-chat #desktop-popup-chat-messages {
    padding: 18px 16px !important;
    gap: 14px !important;
    background: #313338;
}
.desktop-popup-chat .chat-name-other,
.desktop-popup-chat .chat-name-mine { color: #f2f3f5 !important; }
.desktop-popup-chat .chat-time-text { color: #949ba4 !important; }
.desktop-popup-chat .chat-bubble-other,
.desktop-popup-chat .chat-bubble-mine {
    border: 0 !important;
    border-radius: 10px !important;
    padding: 9px 12px !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    line-height: 1.55;
}
.desktop-popup-chat .chat-bubble-other { background: #2b2d31 !important; color: #dbdee1 !important; }
.desktop-popup-chat .chat-bubble-mine { background: #5865f2 !important; color: #fff !important; }
.desktop-popup-chat .chat-avatar-other,
.desktop-popup-chat .chat-avatar-mine { border: 0 !important; width: 34px !important; height: 34px !important; }
.desktop-popup-chat .chat-footer-bar {
    background: #383a40 !important;
    border-top: 0 !important;
    padding: 12px !important;
}
.desktop-popup-chat .chat-input-box {
    background: #1e1f22 !important;
    border: 0 !important;
    color: #dbdee1 !important;
    min-height: 42px;
    border-radius: 10px !important;
}
.desktop-popup-chat .chat-input-box::placeholder { color: #949ba4; }
.desktop-popup-chat .chat-input-box:focus { box-shadow: 0 0 0 2px rgba(88,101,242,.35) !important; }
.desktop-popup-chat .chat-send-btn { background: #5865f2 !important; color: #fff !important; border-radius: 10px !important; }
.desktop-popup-chat .chat-send-btn:hover { background: #4752c4 !important; }
.desktop-popup-chat .chat-icon-btn,
.desktop-popup-chat .chat-close-btn { background: #2b2d31 !important; color: #b5bac1 !important; }
.desktop-popup-chat .chat-icon-btn:hover,
.desktop-popup-chat .chat-close-btn:hover { background: #3f4147 !important; color: #fff !important; }

/* Full chat page follows the same visual language. */
#fullpage-chat .full-page-header {
    background: rgba(17,24,39,.94) !important;
    border-bottom: 1px solid rgba(255,255,255,.08) !important;
}
#fullpage-chat .full-page-body { background: rgba(49,51,56,.94); }
#fullpage-chat .chat-sidebar-tabs { background: #2b2d31; border-color: rgba(0,0,0,.2); }
#fullpage-chat .chat-main-area { background: #313338; }
#fullpage-chat .chat-tab-btn-v { color: #b5bac1; }
#fullpage-chat .chat-tab-btn-v:hover { color: #fff; background: #3f4147; border-color: transparent; }
#fullpage-chat .chat-tab-btn-v.active { color: #fff; background: #5865f2; border-color: transparent; box-shadow: none; }

/* Profile and player dossier: clearer hierarchy, larger readable text, modern cards. */
#avatar-choices-grid {
    padding: 10px !important;
    background: rgba(17,24,39,.72) !important;
    border-color: rgba(114,137,218,.28) !important;
}
.avatar-choice-card {
    width: 54px;
    height: 54px;
    padding: 4px;
    border-radius: 12px;
    background: #2b2d31;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease, background .16s ease;
}
.avatar-choice-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
.avatar-choice-card:hover { transform: translateY(-2px); background: #3f4147; }
.avatar-choice-card.active { border-color: #5865f2; background: rgba(88,101,242,.18); box-shadow: 0 0 0 3px rgba(88,101,242,.16); }
#profile-avatar-preview { filter: drop-shadow(0 8px 18px rgba(0,0,0,.55)) !important; }
#profile-name-input { font-size: 13px !important; }
#profile-title-select { min-height: 38px; font-size: 12px !important; }
#detail-avatar-img { filter: drop-shadow(0 8px 18px rgba(0,0,0,.6)); }
#detail-action-container button { min-height: 42px; }

/* Slightly more readable modal typography overall. */
.wood-modal-body { font-size: 12px; }
.wood-modal-body .text-\\[9px\\],
.wood-modal-body .text-\\[10px\\],
.wood-modal-body .text-\\[10.5px\\] { letter-spacing: .05px; }

@media (max-width: 640px) {
    .settings-tab-bar { gap: 6px; overflow-x: auto; justify-content: center !important; }
    .settings-tab-bar .wood-tab-btn { font-size: 12px !important; padding-inline: 10px; }
    .rpg-dropdown-menu { max-height: 210px; }
    .avatar-choice-card { width: 48px; height: 48px; }
}
'''
          css = style.read_text(encoding='utf-8')
          if 'AntWar v1.0 UI polish' not in css:
              style.write_text(css + css_patch, encoding='utf-8')

          # 4) Release metadata v1.0.
          html = index.read_text(encoding='utf-8')
          if 'name="ui-version"' not in html:
              html = html.replace('<title id="game-title" data-i18n="game.title">AntWar</title>', '<title id="game-title" data-i18n="game.title">AntWar</title>\n    <meta name="ui-version" content="v1.0">')
          if 'data-ui-version="v1.0"' not in html:
              html = html.replace('<body id="game-body"', '<body data-ui-version="v1.0" id="game-body"', 1)
          index.write_text(html, encoding='utf-8')

          data = json.loads(package.read_text(encoding='utf-8'))
          data['version'] = '1.0.0'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit and clean up maintenance workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css script.js index.html package.json
          git rm .github/workflows/antwar-ui-maintenance.yml
          git commit -m "[ui-maintenance] feat(ui): release v1.0 settings chat profiles fixes" || exit 0
          git push origin main
